<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h2>Bienvenido</h2>
        <p class="subtitle">Inicie sesión para seguir cocinando</p>

        <form id="login-form">

            <div class="input-group">
                <input type="text" id="login-user" placeholder="Nombre de usuario">
            </div>

            <div class="input-group">
                <input type="password" id="login-pass" placeholder="Contraseña">
            </div>

            <button type="submit" class="btn-main">Iniciar sesión</button>

            <p class="auth-switch">
                ¿No tiene una cuenta?
                <a href="signup.html">Crear cuenta</a>
            </p>

        </form>

    </div>

</div>

<script src="../js/login.js"></script>
</body>
</html>
